name: Linux

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    tags:
      - v*
  pull_request:

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  package:
    name: Ubuntu 22.04 package
    runs-on: ubuntu-22.04
    steps:
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils cmake file ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set package version
        shell: bash
        run: |
          version=1.11.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Release tags must use vMAJOR.MINOR.PATCH format: $GITHUB_REF_NAME" >&2
              exit 2
            }
          fi
          echo "PBOM_VERSION=$version" >> "$GITHUB_ENV"
          echo "PBOM_BUILD_NUMBER=${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64

      - name: Configure release
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DBUILD_TESTING=OFF
          -DPBOM_VERSION:STRING="${PBOM_VERSION}"
          -DPBOM_BUILD_NUMBER:STRING="${PBOM_BUILD_NUMBER}"

      - name: Build release
        run: cmake --build build

      - name: Download pinned deployment tools
        run: |
          mkdir -p tools
          curl --fail --location --output tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          curl --fail --location --output tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-qt-x86_64.AppImage packaging/linux/*.sh packaging/linux/AppRun

      - name: Package AppDir, tarball, and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LINUXDEPLOY: ${{ github.workspace }}/tools/linuxdeploy-x86_64.AppImage
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: packaging/linux/package.sh build dist

      - name: Audit binary ABI requirements
        run: |
          set -o pipefail
          find dist/PBOManager.AppDir -type f -perm /111 -exec file {} + | grep ELF | cut -d: -f1 | xargs -r objdump -T | grep -E 'GLIBC(X{2})?_[0-9]' > dist/abi-symbols.txt
          ! grep -E 'GLIBC_2\.(3[6-9]|[4-9][0-9])' dist/abi-symbols.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PBOManager-linux-x86_64
          path: |
            dist/PBOManager-x86_64.AppDir.tar.gz
            dist/PBOManager-x86_64.AppImage
            dist/SHA256SUMS
            dist/abi-symbols.txt

      - name: Publish AppImage to GitHub Release
        id: publish_release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{github.ref_name}}
          name: ${{github.ref_name}}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/PBOManager-x86_64.AppImage
            dist/PBOManager-x86_64.AppDir.tar.gz
            dist/SHA256SUMS

      - name: Report Linux release publication failure
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish_release.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const title = `Release publication failed: ${tag} (Linux)`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The Linux release job could not publish or replace the assets for **${tag}**.`,
              '',
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'The AppImage, AppDir tarball, or checksum file may be missing or stale. Re-run the failed workflow after resolving the upload error.'
            ].join('\n');
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
            core.setFailed(`Release publication failed; tracking issue: ${title}`);
