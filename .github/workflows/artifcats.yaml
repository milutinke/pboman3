name: Artifacts

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    tags:
      - v*

defaults:
  run:
    shell: powershell

jobs:
  release:
    name: Make artifacts
    runs-on: windows-2022
    steps:
      - name: Set Short Sha
        run: |
          echo "git_sha=$('${{github.sha}}'.Substring(0, 7))" >> $env:GITHUB_ENV

      - name: Set Version Information - Main
        if: ${{startsWith(github.ref, 'refs/tags/v')}}
        run: |
          $version = '${{github.ref_name}}' -replace '^v',''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH format: ${{github.ref_name}}"
          }
          $revision = [int64]'${{github.run_number}}' % 65535
          echo "pbom_version=$version" >> $env:GITHUB_ENV
          echo "pbom_build_number=${{github.run_number}} (${{env.git_sha}})" >> $env:GITHUB_ENV
          echo "pbom_installer_version=$version" >> $env:GITHUB_ENV
          echo "pbom_msix_version=$version.$revision" >> $env:GITHUB_ENV

      - name: Set Version Information - Branch
        if: ${{startsWith(github.ref, 'refs/heads/')}}
        run: |
          echo "pbom_version=$('${{github.ref}}' -replace 'refs/heads/','' -replace '[^\w\d]','_')" >> $env:GITHUB_ENV
          echo "pbom_build_number=${{github.run_number}} (${{env.git_sha}})" >> $env:GITHUB_ENV
          echo "pbom_installer_version=0.0.${{github.run_number}}" >> $env:GITHUB_ENV
          echo "pbom_msix_version=0.0.0.${{github.run_number}}" >> $env:GITHUB_ENV

      - name: Install MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Wix
        run: |
          dotnet tool install wix --create-manifest-if-needed --version 6.0.2
          dotnet tool run wix extension add WixToolset.UI.wixext/6.0.2
          dotnet tool run wix extension add WixToolset.Util.wixext/6.0.2          
      
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{github.workspace}}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: code
          submodules: true
      
      - name: CMake Cache
        run: |
         cmake -S ${{github.workspace}}\code\ -B ${{github.workspace}}\_build\ `
         -G Ninja -DCMAKE_BUILD_TYPE=Release `
         -DPBOM_BUILD_NUMBER:STRING="${{env.pbom_build_number}}" `
         -DPBOM_VERSION:STRING="${{env.pbom_version}}"
      
      - name: CMake Build
        run: cmake --build ${{github.workspace}}\_build\

      - name: CMake Install
        run: |
            cmake --install ${{github.workspace}}\_build\ --prefix "${{github.workspace}}\_install\"
            mkdir ${{github.workspace}}\_artifacts\
            cp -Path ${{github.workspace}}\_install\bin -Destination "${{github.workspace}}\_artifacts\" -Recurse
            mv -Path ${{github.workspace}}\_artifacts\bin -Destination "${{github.workspace}}\_artifacts\PBO Manager"

      - name: Package portable Windows release
        run: |
          mkdir ${{github.workspace}}\_release\
          Compress-Archive -Path "${{github.workspace}}\_artifacts\PBO Manager\*" -DestinationPath "${{github.workspace}}\_release\PBOManager-Windows-x86_64.zip"
     
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: PBOManager-binaries-${{env.pbom_version}}-${{env.pbom_build_number}}
          path: ${{github.workspace}}\_artifacts\

      - name: Build installer
        run: |
          dotnet tool run wix build `
            -d ArtifactsFolder=${{github.workspace}}\_install\bin\ `
            -d ProductVersion="${{env.pbom_installer_version}}" `
            -arch x64 `
            -out ${{github.workspace}}\_artifacts\PBOManager.${{env.pbom_installer_version}}.msi `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            ${{github.workspace}}\code\installer\PBOManager.xml

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: PBOManager-installer-${{env.pbom_version}}-${{env.pbom_build_number}}
          path: ${{github.workspace}}\_artifacts\PBOManager.${{env.pbom_installer_version}}.msi

      - name: Build MSIX package
        run: |
            $env:PATH = $env:PATH + ";C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64"
            cp -Path ${{github.workspace}}\code\msix\package\ -Destination ${{github.workspace}}\_msix\ -Recurse
            (Get-Content ${{github.workspace}}\code\msix\AppxManifest.xml -Raw).Replace('Version="0.0.0.0"', 'Version="${{env.pbom_msix_version}}"') | Set-Content ${{github.workspace}}\_msix\AppxManifest.xml -Encoding utf8
            makepri.exe new /of ${{github.workspace}}\_msix\resources.pri /mn ${{github.workspace}}\_msix\AppxManifest.xml /pr ${{github.workspace}}\_msix\ /cf ${{github.workspace}}\code\msix\priconfig.xml
            cp -Path ${{github.workspace}}\_install\bin\* -Destination ${{github.workspace}}\_msix\ -Recurse
            makeappx.exe pack /d ${{github.workspace}}\_msix\ /p ${{github.workspace}}\_artifacts\PBOManager.${{env.pbom_msix_version}}.msix
      
      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: PBOManager-msix-${{env.pbom_version}}-${{env.pbom_build_number}}
          path: ${{github.workspace}}\_artifacts\PBOManager.${{env.pbom_msix_version}}.msix

      - name: Publish Windows packages to GitHub Release
        id: publish_release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{github.ref_name}}
          name: ${{github.ref_name}}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            _release/PBOManager-Windows-x86_64.zip
            _artifacts/PBOManager.${{env.pbom_installer_version}}.msi
            _artifacts/PBOManager.${{env.pbom_msix_version}}.msix

      - name: Report Windows release publication failure
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish_release.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const title = `Release publication failed: ${tag} (Windows)`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The Windows release job could not publish or replace the assets for **${tag}**.`,
              '',
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'The portable ZIP, MSI, or MSIX may be missing or stale. Re-run the failed workflow after resolving the upload error.'
            ].join('\n');
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
            core.setFailed(`Release publication failed; tracking issue: ${title}`);
